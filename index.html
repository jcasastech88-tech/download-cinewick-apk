<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinewick | Descarga la App Oficial</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #e50914;
            --dark: #000000;
            --glass: rgba(15, 15, 15, 0.85);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--dark);
            color: white;
            overflow-x: hidden;
        }

        /* NAVBAR - Corrección de visibilidad */
        nav {
            position: fixed;
            top: 0; width: 100%; padding: 25px 5%;
            z-index: 2000; /* Prioridad máxima */
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
        }
        .nav-logo { font-size: 1.6rem; font-weight: 900; color: var(--primary); text-decoration: none; }
        .nav-link { 
            color: white; 
            text-decoration: none; 
            font-size: 0.85rem; 
            font-weight: bold; 
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2001;
        }

        /* HERO */
        .hero {
            position: relative;
            height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        .hero-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://assets.nflxext.com/ffe/siteui/vlv3/7502c389-42e1-452f-981d-cf2c2e6b22c0/604870f2-5369-4e08-9d9e-c85e25a2e6f4/ES-es-20230206-popsignuptwoweeks-perspective_alpha_website_large.jpg');
            background-size: cover; background-position: center;
            filter: brightness(0.3) blur(5px);
            z-index: 1;
        }

        .main-card {
            position: relative;
            z-index: 10;
            background-color: var(--glass);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 { font-size: 2.2rem; margin: 0 0 10px 0; font-weight: 800; }
        .tagline { color: #ccc; margin-bottom: 35px; font-size: 1.1rem; }

        .btn-download {
            background: var(--primary);
            color: white;
            padding: 18px;
            width: 100%;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            transition: 0.3s;
            margin-bottom: 35px;
        }

        .stats-row {
            display: flex; justify-content: space-around;
            border-top: 1px solid rgba(255,255,255,0.1); padding-top: 25px;
        }
        .stat-box i { color: var(--primary); font-size: 1rem; margin-bottom: 5px; display: block; }
        .stat-box span { font-weight: 800; font-size: 1rem; display: block; }
        .stat-box p { font-size: 0.7rem; color: #888; margin: 0; text-transform: uppercase; }

        /* CARRUSEL - Corrección de desplazamiento */
        .trending { padding: 80px 0; background: #000; overflow: hidden; }
        .trending h2 { text-align: center; margin-bottom: 50px; font-weight: 300; }
        
        .poster-container {
            width: 100%; 
            overflow-x: auto; 
            padding: 20px 0 80px 15%; /* Padding izquierdo para centrar inicio */
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .poster-container::-webkit-scrollbar { display: none; }

        .poster-track { 
            display: flex; 
            gap: 70px; 
            width: max-content; 
            padding-right: 15%; /* ESPACIO FINAL para poder ver el 6to poster */
        }

        .poster-link {
            position: relative; width: 180px; height: 260px;
            flex-shrink: 0; display: block; transition: 0.4s;
        }
        .poster-link img {
            width: 100%; height: 100%; object-fit: cover;
            border-radius: 6px; position: relative; z-index: 1;
        }

        .poster-link::before {
            content: attr(data-rank);
            position: absolute; bottom: -30px; left: -65px;
            font-size: 200px; font-weight: 900; z-index: 5;
            color: #000; -webkit-text-stroke: 2px #fff;
            font-family: 'Arial Black', sans-serif; letter-spacing: -12px;
            line-height: 1; pointer-events: none;
        }

        footer { padding: 40px; text-align: center; background: #000; border-top: 1px solid #111; }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="nav-logo">CINEWICK</a>
        <a href="https://cinewick-vip.blogspot.com/" class="nav-link">Web Oficial</a>
    </nav>

    <section class="hero">
        <div class="hero-bg"></div>
        <div class="main-card" data-aos="fade-up">
            <h1>Películas y series sin límites.</h1>
            <p class="tagline">La APK más completa con estrenos diarios en HD.</p>
            
            <a href="TU_LINK_DE_DESCARGA" class="btn-download">
                <i class="fab fa-android"></i> DESCARGAR APK GRATIS
            </a>

            <div class="stats-row">
                <div class="stat-box"><i class="fas fa-download"></i><span id="count">15,421+</span><p>Descargas</p></div>
                <div class="stat-box"><i class="fas fa-shield-alt"></i><span>SIN VIRUS</span><p>Protección</p></div>
                <div class="stat-box"><i class="fas fa-star"></i><span>4.9 / 5</span><p>Valoración</p></div>
            </div>
        </div>
    </section>

    <section class="trending">
        <h2>Contenido Recién Agregado</h2>
        <div class="poster-container">
            <div id="poster-track" class="poster-track">
                </div>
        </div>
    </section>

    <footer>
        <p style="font-size:0.7rem; color:#444;">© 2026 Cinewick - Made for Movie Lovers</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
        const CONFIG = {
            TMDB_KEY: '51800c8d9e13631a7ded6f17f363e7a5',
            BLOG_URL: 'https://cinewick-vip.blogspot.com/feeds/posts/default?alt=json-in-script&callback=renderMovies&max-results=6'
        };

        window.renderMovies = async function(data) {
            const track = document.getElementById('poster-track');
            const entries = data.feed.entry;
            if (!entries) return;
            track.innerHTML = ''; 

            for (let i = 0; i < entries.length; i++) {
                const entry = entries[i];
                let imgUrl = "";
                const postLink = entry.link.find(l => l.rel === 'alternate').href;
                const content = entry.content ? entry.content.$t : "";
                const tmdbMatch = content.match(/(?:movie|tv)\/(\d+)/) || content.match(/id=(\d+)/);

                if (tmdbMatch && tmdbMatch[1]) {
                    try {
                        const res = await fetch(`https://api.themoviedb.org/3/${content.includes('tv/') ? 'tv' : 'movie'}/${tmdbMatch[1]}?api_key=${CONFIG.TMDB_KEY}&language=es-ES`);
                        const movie = await res.json();
                        if(movie.poster_path) imgUrl = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                    } catch(e) {}
                }
                if (!imgUrl && entry.media$thumbnail) imgUrl = entry.media$thumbnail.url.replace('/s72-c/', '/w500/');

                if (imgUrl) {
                    const card = document.createElement('a');
                    card.href = postLink;
                    card.className = 'poster-link';
                    card.setAttribute('data-rank', i + 1);
                    card.innerHTML = `<img src="${imgUrl}" alt="Poster">`;
                    track.appendChild(card);
                }
            }
        };

        (function() {
            const script = document.createElement('script');
            script.src = CONFIG.BLOG_URL;
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
