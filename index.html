<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinewick | Descarga la App Oficial</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #e50914;
            --dark: #0a0a0a;
            --glass: rgba(0, 0, 0, 0.65);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--dark);
            color: white;
            overflow-x: hidden;
        }

        /* Navbar */
        nav {
            position: fixed;
            top: 0; width: 100%; padding: 15px 5%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
        }

        .nav-logo { font-size: 1.8rem; font-weight: 900; color: var(--primary); text-decoration: none; }

        /* Hero Section */
        .hero {
            position: relative; height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        .hero-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://assets.nflxext.com/ffe/siteui/vlv3/76c5a455-c62c-46d4-8653-3924728113e3/web/AR-es-20260504-TRIFECTA-perspective_1ac5b690-1221-478e-bb49-c2e0abc5c2a9_large.jpg');
            background-size: cover; background-position: center;
            filter: brightness(0.3) blur(4px); z-index: 1;
        }

        .hero-content { position: relative; z-index: 2; text-align: center; max-width: 800px; padding: 0 20px; }

        .glass-card {
            background: var(--glass); backdrop-filter: blur(20px);
            padding: 50px 40px; border-radius: 24px; 
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-main {
            background: var(--primary); color: white; padding: 20px 45px;
            border-radius: 12px; text-decoration: none; font-weight: bold;
            font-size: 1.3rem; display: inline-flex; align-items: center; gap: 15px; 
            transition: 0.3s;
        }

        .stats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 30px; margin-top: 30px;
        }

        /* --- SECCIÓN CONTENIDO RECIÉN AGREGADO (TOP 6) --- */
        .trending { padding: 80px 0; background: #000; }
        .trending h2 { text-align: center; margin-bottom: 60px; font-weight: 300; font-size: 1.8rem; }
        
        .poster-container {
            width: 100%; overflow-x: auto; padding: 20px 5% 80px 12%;
            scrollbar-width: none;
        }
        .poster-container::-webkit-scrollbar { display: none; }

        .poster-track { display: flex; gap: 60px; width: max-content; }

        .poster-link {
            position: relative;
            width: 190px;
            height: 280px;
            flex-shrink: 0;
            text-decoration: none;
            transition: 0.4s ease;
            display: block;
        }

        /* La imagen va detrás del número */
        .poster-link img {
            width: 100%; height: 100%; object-fit: cover;
            border-radius: 6px; 
            position: relative; 
            z-index: 1; 
        }

        /* El Número Gigante (AL FRENTE) */
        .poster-link::before {
            content: attr(data-rank);
            position: absolute; 
            bottom: -35px; 
            left: -75px;
            font-size: 220px; 
            font-weight: 900; 
            z-index: 2; /* CAMBIO CLAVE: El número ahora está encima */
            color: #000; 
            -webkit-text-stroke: 3px #fff; /* Borde blanco para resaltar contra el poster */
            font-family: 'Arial Black', sans-serif; 
            letter-spacing: -12px;
            line-height: 1;
            pointer-events: none; /* Permite que el click pase al link */
        }

        .poster-link:hover { transform: scale(1.08); z-index: 10; }
        .poster-link:hover::before { -webkit-text-stroke: 3px var(--primary); color: rgba(0,0,0,0.8); }

        footer { padding: 50px 20px; text-align: center; color: #555; }

        @media (max-width: 768px) {
            .poster-link { width: 150px; height: 220px; margin-left: 30px; }
            .poster-link::before { font-size: 160px; left: -55px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="nav-logo">CINEWICK</a>
        <a href="https://cinewick-vip.blogspot.com/" style="color:white; text-decoration:none; font-weight:bold;">WEB OFICIAL</a>
    </nav>

    <section class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content" data-aos="zoom-in">
            <div class="glass-card">
                <h1>Películas y series sin límites.</h1>
                <p style="margin-bottom:30px; color:#ccc;">La APK más completa con estrenos diarios en HD.</p>
                
                <a href="TU_LINK_DE_DESCARGA" class="btn-main">
                    <i class="fab fa-android"></i> DESCARGAR APK GRATIS
                </a>

                <div class="stats-grid">
                    <div class="stat-item"><i class="fas fa-download"></i><span id="count">15,421+</span><p>Descargas</p></div>
                    <div class="stat-item"><i class="fas fa-shield-virus"></i><span>SIN VIRUS</span><p>Protección</p></div>
                    <div class="stat-item"><i class="fas fa-star"></i><span>4.9 / 5</span><p>Valoración</p></div>
                </div>
            </div>
        </div>
    </section>

    <section class="trending">
        <h2>Contenido Recién Agregado</h2>
        <div class="poster-container">
            <div id="poster-track" class="poster-track">
                </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Cinewick App</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });

        const CONFIG = {
            TMDB_KEY: '51800c8d9e13631a7ded6f17f363e7a5',
            BLOG_URL: 'https://cinewick-vip.blogspot.com/feeds/posts/default?alt=json-in-script&callback=renderMovies&max-results=6'
        };

        window.renderMovies = async function(data) {
            const track = document.getElementById('poster-track');
            const entries = data.feed.entry;
            if (!entries) return;
            track.innerHTML = ''; 

            for (let i = 0; i < entries.length; i++) {
                const entry = entries[i];
                let imgUrl = "";
                const postLink = entry.link.find(l => l.rel === 'alternate').href;
                const content = entry.content ? entry.content.$t : (entry.summary ? entry.summary.$t : "");
                const tmdbMatch = content.match(/(?:movie|tv)\/(\d+)/) || content.match(/id=(\d+)/);

                if (tmdbMatch && tmdbMatch[1]) {
                    try {
                        const id = tmdbMatch[1];
                        const type = content.includes('tv/') ? 'tv' : 'movie';
                        const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${CONFIG.TMDB_KEY}&language=es-ES`);
                        const movie = await res.json();
                        if(movie.poster_path) imgUrl = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                    } catch(e) {}
                }

                if (!imgUrl && entry.media$thumbnail) {
                    imgUrl = entry.media$thumbnail.url.replace('/s72-c/', '/w500/');
                }

                if (imgUrl) {
                    const card = document.createElement('a');
                    card.href = postLink;
                    card.className = 'poster-link';
                    card.setAttribute('data-rank', i + 1);
                    card.innerHTML = `<img src="${imgUrl}" alt="Poster">`;
                    track.appendChild(card);
                }
            }
        };

        // Contador
        let downloads = 15421;
        setInterval(() => {
            downloads += Math.floor(Math.random() * 2);
            document.getElementById('count').innerText = downloads.toLocaleString() + "+";
        }, 6000);

        // Iniciar carga
        (function() {
            const script = document.createElement('script');
            script.src = CONFIG.BLOG_URL;
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
