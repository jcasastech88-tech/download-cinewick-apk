<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinewick | Descarga la App Oficial</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #e50914;
            --dark: #000000;
            --card-bg: #0f0f0f;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--dark);
            color: white;
            overflow-x: hidden;
        }

        /* Navbar Minimalista */
        nav {
            position: absolute;
            top: 0; width: 100%; padding: 30px 5%;
            z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
        }
        .nav-logo { font-size: 1.5rem; font-weight: 900; color: var(--primary); text-decoration: none; letter-spacing: 1px; }

        /* Hero con Tarjeta Central (El diseño que te gusta) */
        .hero {
            height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
        }

        .main-card {
            background-color: var(--card-bg);
            padding: 60px 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            border: 1px solid #1f1f1f;
        }

        h1 { font-size: 2rem; margin-bottom: 10px; font-weight: 800; }
        .tagline { color: #888; margin-bottom: 40px; font-size: 1rem; }

        .btn-download {
            background: var(--primary);
            color: white;
            padding: 18px 0;
            width: 100%;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.3s;
            margin-bottom: 40px;
        }
        .btn-download:hover { background: #b9090b; transform: scale(1.02); }

        /* Stats Minimalistas */
        .stats-row {
            display: flex; justify-content: space-around;
            border-top: 1px solid #1f1f1f; padding-top: 30px;
        }
        .stat-box { text-align: center; }
        .stat-box i { font-size: 0.9rem; margin-bottom: 8px; display: block; }
        .stat-box span { font-weight: 800; font-size: 0.9rem; display: block; }
        .stat-box p { font-size: 0.7rem; color: #555; margin: 0; text-transform: uppercase; }

        /* Sección Contenido - Ranking Netflix Frontal */
        .trending { padding: 100px 0; background: #000; }
        .trending h2 { text-align: center; margin-bottom: 60px; font-weight: 400; font-size: 1.5rem; }
        
        .poster-container {
            width: 100%; overflow-x: auto; padding: 20px 5% 80px 10%;
            scrollbar-width: none;
        }
        .poster-container::-webkit-scrollbar { display: none; }
        .poster-track { display: flex; gap: 60px; width: max-content; }

        .poster-link {
            position: relative; width: 180px; height: 260px;
            flex-shrink: 0; display: block; transition: 0.4s;
        }
        .poster-link img {
            width: 100%; height: 100%; object-fit: cover;
            border-radius: 4px; position: relative; z-index: 1;
        }

        /* Números AL FRENTE */
        .poster-link::before {
            content: attr(data-rank);
            position: absolute; bottom: -30px; left: -60px;
            font-size: 180px; font-weight: 900; z-index: 5;
            color: #000; -webkit-text-stroke: 2px #fff;
            font-family: 'Arial Black', sans-serif; letter-spacing: -10px;
            line-height: 1; pointer-events: none;
        }

        .poster-link:hover { transform: scale(1.05); }
        .poster-link:hover::before { -webkit-text-stroke: 2px var(--primary); }

        footer { padding: 40px; text-align: center; border-top: 1px solid #111; }
        .social { margin-bottom: 20px; }
        .social a { color: #fff; margin: 0 10px; opacity: 0.6; transition: 0.3s; }
        .social a:hover { opacity: 1; }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="nav-logo">CINEWICK</a>
        <a href="https://cinewick-vip.blogspot.com/" style="color:white; text-decoration:none; font-size:0.8rem; font-weight:bold; opacity:0.8;">WEB OFICIAL</a>
    </nav>

    <section class="hero">
        <div class="main-card" data-aos="fade-up">
            <h1>Películas y series sin límites.</h1>
            <p class="tagline">La APK más completa con estrenos diarios en HD.</p>
            
            <a href="TU_LINK_DE_MEDIAFIRE" class="btn-download">
                <i class="fab fa-android"></i> DESCARGAR APK GRATIS
            </a>

            <div class="stats-row">
                <div class="stat-box">
                    <i class="fas fa-download" style="color:#e50914"></i>
                    <span id="count">15,421+</span>
                    <p>Descargas</p>
                </div>
                <div class="stat-box">
                    <i class="fas fa-shield-alt" style="color:#2ecc71"></i>
                    <span>SIN VIRUS</span>
                    <p>Protección</p>
                </div>
                <div class="stat-box">
                    <i class="fas fa-star" style="color:#f1c40f"></i>
                    <span>4.9 / 5</span>
                    <p>Valoración</p>
                </div>
            </div>
        </div>
    </section>

    <section class="trending">
        <h2>Contenido Recién Agregado</h2>
        <div class="poster-container">
            <div id="poster-track" class="poster-track">
                </div>
        </div>
    </section>

    <footer>
        <div class="social">
            <a href="#"><i class="fab fa-telegram-plane"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
        </div>
        <p style="font-size:0.7rem; color:#444;">© 2026 Cinewick - Made with ❤️ for Movie Lovers</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        const CONFIG = {
            TMDB_KEY: '51800c8d9e13631a7ded6f17f363e7a5',
            BLOG_URL: 'https://cinewick-vip.blogspot.com/feeds/posts/default?alt=json-in-script&callback=renderMovies&max-results=6'
        };

        window.renderMovies = async function(data) {
            const track = document.getElementById('poster-track');
            const entries = data.feed.entry;
            if (!entries) return;
            track.innerHTML = ''; 

            for (let i = 0; i < entries.length; i++) {
                const entry = entries[i];
                let imgUrl = "";
                const postLink = entry.link.find(l => l.rel === 'alternate').href;
                const content = entry.content ? entry.content.$t : "";
                const tmdbMatch = content.match(/(?:movie|tv)\/(\d+)/) || content.match(/id=(\d+)/);

                if (tmdbMatch && tmdbMatch[1]) {
                    try {
                        const res = await fetch(`https://api.themoviedb.org/3/${content.includes('tv/') ? 'tv' : 'movie'}/${tmdbMatch[1]}?api_key=${CONFIG.TMDB_KEY}&language=es-ES`);
                        const movie = await res.json();
                        if(movie.poster_path) imgUrl = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                    } catch(e) {}
                }

                if (!imgUrl && entry.media$thumbnail) imgUrl = entry.media$thumbnail.url.replace('/s72-c/', '/w500/');

                if (imgUrl) {
                    const card = document.createElement('a');
                    card.href = postLink;
                    card.className = 'poster-link';
                    card.setAttribute('data-rank', i + 1);
                    card.innerHTML = `<img src="${imgUrl}" alt="Poster">`;
                    track.appendChild(card);
                }
            }
        };

        (function() {
            const script = document.createElement('script');
            script.src = CONFIG.BLOG_URL;
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
