<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinewick | Descarga la App Oficial</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #e50914;
            --dark: #0a0a0a;
            --glass: rgba(0, 0, 0, 0.6);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--dark);
            color: white;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Navbar Original */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 15px 5%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary);
            text-decoration: none;
        }

        /* Hero Section (Diseño anterior restaurado) */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://assets.nflxext.com/ffe/siteui/vlv3/7502c389-42e1-452f-981d-cf2c2e6b22c0/604870f2-5369-4e08-9d9e-c85e25a2e6f4/ES-es-20230206-popsignuptwoweeks-perspective_alpha_website_large.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.4) blur(4px);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 800px;
            padding: 0 20px;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 50px 40px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 { font-size: clamp(2.5rem, 5vw, 4rem); margin: 0 0 20px 0; }
        .tagline { font-size: 1.2rem; color: #ccc; margin-bottom: 35px; }

        .btn-main {
            background: var(--primary);
            color: white;
            padding: 20px 45px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.3rem;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
        }

        /* SECCIÓN TENDENCIAS (NUEVO ESTILO RANKING) */
        .trending { padding: 80px 0; background: #000; overflow: hidden; }
        .trending h2 { text-align: center; margin-bottom: 50px; font-weight: 300; }
        
        .poster-container {
            width: 100%;
            overflow-x: auto;
            padding: 20px 5% 60px 10%;
            scrollbar-width: none;
        }
        .poster-container::-webkit-scrollbar { display: none; }

        .poster-track {
            display: flex;
            gap: 50px; /* Espacio para los números */
            width: max-content;
        }

        .poster-card {
            position: relative;
            width: 180px;
            height: 270px;
            flex-shrink: 0;
            transition: 0.4s ease;
        }

        .poster-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            position: relative;
            z-index: 2;
        }

        /* El Número de Netflix */
        .poster-card::before {
            content: attr(data-rank);
            position: absolute;
            bottom: -25px;
            left: -55px;
            font-size: 180px;
            font-weight: 900;
            line-height: 1;
            z-index: 1;
            color: #000;
            -webkit-text-stroke: 3px #555;
            font-family: 'Arial Black', sans-serif;
            letter-spacing: -10px;
        }

        .poster-card:hover { transform: scale(1.1); z-index: 10; }
        .poster-card:hover::before { -webkit-text-stroke: 3px var(--primary); }

        footer { padding: 40px; text-align: center; border-top: 1px solid #222; color: #666; }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="nav-logo">CINEWICK</a>
        <a href="https://cinewick-vip.blogspot.com/" style="color:white; text-decoration:none;">Web Oficial</a>
    </nav>

    <section class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content" data-aos="fade-up">
            <div class="glass-card">
                <h1>Streaming sin límites.</h1>
                <p class="tagline">Descarga Cinewick APK y disfruta de miles de películas y series en HD.</p>
                <a href="TU_LINK_AQUI" class="btn-main">
                    <i class="fab fa-android"></i> DESCARGAR APK GRATIS
                </a>
            </div>
        </div>
    </section>

    <section class="trending">
        <h2 data-aos="fade-up">Contenido Recién Agregado</h2>
        <div class="poster-container">
            <div class="poster-track" id="poster-track">
                <p>Cargando cartelera...</p>
            </div>
        </div>
    </section>

    <footer>
        <div style="margin-bottom: 20px;">
            <a href="#" style="color:white; margin:0 10px;"><i class="fab fa-telegram"></i></a>
            <a href="#" style="color:white; margin:0 10px;"><i class="fab fa-instagram"></i></a>
        </div>
        <p>&copy; 2026 Cinewick App</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });

        const CONFIG = {
            TMDB_KEY: '51800c8d9e13631a7ded6f17f363e7a5',
            BLOG_URL: 'https://cinewick-vip.blogspot.com/feeds/posts/default?alt=json-in-script&callback=renderMovies&max-results=10'
        };

        window.renderMovies = async function(data) {
            const track = document.getElementById('poster-track');
            const entries = data.feed.entry;
            if (!entries) return;

            track.innerHTML = ''; 

            for (let i = 0; i < entries.length && i < 10; i++) {
                const entry = entries[i];
                let imgUrl = "";
                const content = entry.content ? entry.content.$t : (entry.summary ? entry.summary.$t : "");
                const tmdbMatch = content.match(/(?:movie|tv)\/(\d+)/) || content.match(/id=(\d+)/);

                if (tmdbMatch && tmdbMatch[1]) {
                    try {
                        const id = tmdbMatch[1];
                        const type = content.includes('tv/') ? 'tv' : 'movie';
                        const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${CONFIG.TMDB_KEY}&language=es-ES`);
                        const movie = await res.json();
                        if(movie.poster_path) imgUrl = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                    } catch(e) {}
                }

                if (!imgUrl && entry.media$thumbnail) {
                    imgUrl = entry.media$thumbnail.url.replace('/s72-c/', '/w500/');
                }

                if (imgUrl) {
                    const card = document.createElement('div');
                    card.className = 'poster-card';
                    card.setAttribute('data-rank', i + 1);
                    card.innerHTML = `<img src="${imgUrl}" alt="Poster">`;
                    track.appendChild(card);
                }
            }
        };

        (function() {
            const script = document.createElement('script');
            script.src = CONFIG.BLOG_URL;
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
