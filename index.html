<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinewick | Descarga la App Oficial</title>
    <!-- Librerías Externas -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #e50914;
            --glass: rgba(255, 255, 255, 0.1);
            --dark: #0a0a0a;
        }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--dark);
            color: white;
            scroll-behavior: smooth;
        }

        /* Navbar Moderna */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 15px 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* Hero Section Reforzado */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(10,10,10,1)), 
                        url('https://assets.nflxext.com/ffe/siteui/vlv3/76c5a455-c62c-46d4-8653-3924728113e3/web/AR-es-20260504-TRIFECTA-perspective_1ac5b690-1221-478e-bb49-c2e0abc5c2a9_large.jpg');
            background-size: cover;
            text-align: center;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 24px;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        /* Botón con Glow */
        .btn-main {
            background: var(--primary);
            color: white;
            padding: 18px 40px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
        }

        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.6);
        }

        /* Stats Section */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .stat-item i { color: var(--primary); font-size: 1.5rem; margin-bottom: 5px; }
        .stat-item div { font-size: 1.2rem; font-weight: bold; }
        .stat-item p { font-size: 0.8rem; opacity: 0.7; margin: 0; }

        /* Dispositivos */
        .devices {
            padding: 80px 20px;
            text-align: center;
        }

        .device-icons {
            display: flex;
            justify-content: center;
            gap: 40px;
            font-size: 3rem;
            opacity: 0.5;
            margin-top: 30px;
        }

        .device-icons i:hover { opacity: 1; color: var(--primary); transition: 0.3s; }

    </style>
</head>
<body>

    <nav>
        <div style="font-weight: bold; font-size: 1.5rem; color: var(--primary)">CINEWICK</div>
        <a href="#download" class="btn-main" style="padding: 10px 20px; font-size: 0.9rem;">Descargar Ahora</a>
    </nav>

    <section class="hero">
        <div class="glass-card" data-aos="zoom-in">
            <img src="logo_cinewick.png" alt="Logo" style="width: 100px; margin-bottom: 15px;">
            <h1>El Streaming sin Límites</h1>
            <p>Disfruta de la libertad total. Películas, series y TV en vivo en una sola APK optimizada.</p>
            
            <a href="https://expo.dev/artifacts/eas/cwpPVcemKkrBFbEtUCAY7R.apk" class="btn-main">
                <i class="fab fa-android"></i> Descargar Cinewick v1.0.2
            </a>

            <div class="stats">
                <div class="stat-item">
                    <i class="fas fa-download"></i>
                    <div id="count">15,400+</div>
                    <p>Descargas</p>
                </div>
                <div class="stat-item">
                    <i class="fas fa-star"></i>
                    <div>4.8/5</div>
                    <p>Calificación</p>
                </div>
                <div class="stat-item">
                    <i class="fas fa-shield-alt"></i>
                    <div>Seguro</div>
                    <p>Verificado</p>
                </div>
            </div>
        </div>
    </section>

    <section class="devices">
        <h2 data-aos="fade-up">Disponible en todos tus dispositivos</h2>
        <div class="device-icons" data-aos="fade-up" data-aos-delay="200">
            <i class="fas fa-mobile-alt" title="Smartphone"></i>
            <i class="fas fa-tv" title="Smart TV / TV Box"></i>
            <i class="fas fa-tablet-alt" title="Tablet"></i>
            <i class="fas fa-laptop" title="PC (con emulador)"></i>
        </div>
    </section>

    <!-- Scripts de animación -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });

        // Un pequeño truco para que el contador parezca real
        let count = 15400;
        setInterval(() => {
            count += Math.floor(Math.random() * 3);
            document.getElementById('count').innerText = count.toLocaleString() + "+";
        }, 5000);
    </script>
</body>
</html>
